{% extends "base.html" %}


{% block css_content %}
	<style>
		.wrapper {    
		    margin-top: 35px;
		    margin-bottom: 35px;
		}
		.form-signin {
		    max-width: 420px;
		    padding: 30px 38px 45px;
		    margin: 0 auto;
		    background-color: #eee;
		    border: 3px dotted rgba(0,0,0,0.1);  
		}
		.form-signin-heading {
		    text-align:center;
		    margin-bottom: 30px;
		}
		
		.form-control-signing {
		    position: relative;
		    font-size: 16px;
		    height: auto;
		    padding: 10px;
		}
		#id_username {
		    margin-bottom: 0px;
		    border-bottom-left-radius: 0;
		    border-bottom-right-radius: 0;
		}
		#id_password {
		    margin-bottom: 20px;
		    border-top-left-radius: 0;
		    border-top-right-radius: 0;
		}
		
		.colorgraph {
		    height: 7px;
		    border-top: 0;
		    background: #c4e17f;
		    border-radius: 5px;
		    background-image: -webkit-linear-gradient(left, #c4e17f, #c4e17f 12.5%, #f7fdca 12.5%, #f7fdca 25%, #fecf71 25%, #fecf71 37.5%, #f0776c 37.5%, #f0776c 50%, #db9dbe 50%, #db9dbe 62.5%, #c49cde 62.5%, #c49cde 75%, #669ae1 75%, #669ae1 87.5%, #62c2e4 87.5%, #62c2e4);
		    background-image: -moz-linear-gradient(left, #c4e17f, #c4e17f 12.5%, #f7fdca 12.5%, #f7fdca 25%, #fecf71 25%, #fecf71 37.5%, #f0776c 37.5%, #f0776c 50%, #db9dbe 50%, #db9dbe 62.5%, #c49cde 62.5%, #c49cde 75%, #669ae1 75%, #669ae1 87.5%, #62c2e4 87.5%, #62c2e4);
		    background-image: -o-linear-gradient(left, #c4e17f, #c4e17f 12.5%, #f7fdca 12.5%, #f7fdca 25%, #fecf71 25%, #fecf71 37.5%, #f0776c 37.5%, #f0776c 50%, #db9dbe 50%, #db9dbe 62.5%, #c49cde 62.5%, #c49cde 75%, #669ae1 75%, #669ae1 87.5%, #62c2e4 87.5%, #62c2e4);
		    background-image: linear-gradient(to right, #c4e17f, #c4e17f 12.5%, #f7fdca 12.5%, #f7fdca 25%, #fecf71 25%, #fecf71 37.5%, #f0776c 37.5%, #f0776c 50%, #db9dbe 50%, #db9dbe 62.5%, #c49cde 62.5%, #c49cde 75%, #669ae1 75%, #669ae1 87.5%, #62c2e4 87.5%, #62c2e4);
		}
	</style>
{% endblock %}


{% block body_content %}
    <div class = "container">
	    <div class="wrapper">
	        <form method="post" class="form-signin">       
	            <h3 class="form-signin-heading">Welcome Back!</h3>
	            <hr class="colorgraph"><br>
	            {% csrf_token %}
	            <input type="text" class="form-control form-control-signing" name="username" id="id_username" placeholder="Username" required="" autofocus="" />
	            <input type="password" class="form-control form-control-signing" name="password" id="id_password" placeholder="Password" required=""/>            
	            <button class="btn btn-lg btn-primary btn-block" name="Submit" value="Login" type="Submit">Sign In</button>            
	        </form>         
	    </div>
	</div>
{% endblock %}
